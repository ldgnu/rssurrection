# Despliegue en VPS: sin puertos publicados, detrás del proxy inverso.
services:
  rssurrection:
    build:
      context: ..
      args:
        VERSION: ${RSSURRECTION_VERSION:-1.0.0}
    image: rssurrection:local
    container_name: rssurrection
    restart: unless-stopped
    env_file:
      # format: raw evita que Compose interpole valores con '$' (la contraseña
      # de API de FreshRSS puede contenerlos y se truncaba).
      - path: ../app.env
        format: raw
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  proxy:
    external: true
